<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1160" role="img" aria-labelledby="wfTitle wfDesc">
  <title id="wfTitle">project2tutorial 流水线：七步、五个角色、两道闸门</title>
  <desc id="wfDesc">输入代码仓库或素材目录，经需求确认、代码地图、架构认知、模块深挖、写前冻结、写作、交付闸门七步，产出多章 Markdown 教程。每步的产出是下一步的输入。</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1160" fill="#FFFFFF"/>

  <text x="60" y="58" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#045B89">project2tutorial</text>
  <text x="60" y="90" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#475569">先看懂项目，再写成教程：代码地图 → 架构分层 → 业务模块 → 运行流程 → 逐模块深挖</text>
  <text x="1140" y="58" text-anchor="end" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#64748B">7 步 · 5 角色 · 2 道闸门</text>

  <rect x="60" y="112" width="510" height="64" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="88" y="140" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#334155">代码仓库 / 压缩包</text>
  <text x="88" y="161" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#64748B">本地路径或 clone 下来的目录</text>

  <rect x="630" y="112" width="510" height="64" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="658" y="140" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#334155">素材目录</text>
  <text x="658" y="161" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#64748B">按专题写的笔记 / 提示词合集</text>

  <line x1="315" y1="176" x2="315" y2="192" stroke="#94A3B8" stroke-width="2"/>
  <line x1="885" y1="176" x2="885" y2="192" stroke="#94A3B8" stroke-width="2"/>
  <line x1="315" y1="192" x2="885" y2="192" stroke="#94A3B8" stroke-width="2"/>
  <line x1="600" y1="192" x2="600" y2="208" stroke="#94A3B8" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 0 需求确认 -->
  <rect x="60" y="210" width="1080" height="86" rx="12" fill="#FFFFFF" stroke="#045B89" stroke-width="2"/>
  <rect x="88" y="237" width="44" height="32" rx="16" fill="#045B89"/>
  <text x="110" y="259" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">0</text>
  <text x="150" y="244" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#0F172A">需求确认</text>
  <text x="150" y="270" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">问清五件事：来源、读者、深度、输出目录、素材范围；缺项就问，别替用户决定</text>
  <rect x="960" y="237" width="150" height="32" rx="16" fill="#E0F2FE" stroke="#7DD3FC"/>
  <text x="1035" y="258" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#075985">主理人</text>
  <line x1="110" y1="296" x2="110" y2="314" stroke="#94A3B8" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 1 代码地图 -->
  <rect x="60" y="316" width="1080" height="86" rx="12" fill="#FFFFFF" stroke="#045B89" stroke-width="2"/>
  <rect x="88" y="343" width="44" height="32" rx="16" fill="#045B89"/>
  <text x="110" y="365" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
  <text x="150" y="350" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#0F172A">代码地图</text>
  <text x="150" y="376" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">文件树、入口点、依赖与精确版本、构建运行方式；只记「是什么」，不写「为什么」</text>
  <rect x="960" y="343" width="150" height="32" rx="16" fill="#E0F2FE" stroke="#7DD3FC"/>
  <text x="1035" y="364" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#075985">Evan Trace</text>
  <line x1="110" y1="402" x2="110" y2="420" stroke="#94A3B8" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 2 架构认知 -->
  <rect x="60" y="422" width="1080" height="86" rx="12" fill="#FFFFFF" stroke="#045B89" stroke-width="2"/>
  <rect x="88" y="449" width="44" height="32" rx="16" fill="#045B89"/>
  <text x="110" y="471" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
  <text x="150" y="456" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#0F172A">架构认知</text>
  <text x="150" y="482" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">分层画像 + 业务模块清单 + 全局运行流程；每个节点标 文件:行号</text>
  <rect x="960" y="449" width="150" height="32" rx="16" fill="#E0F2FE" stroke="#7DD3FC"/>
  <text x="1035" y="470" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#075985">Atlas Vaughn</text>
  <line x1="110" y1="508" x2="110" y2="526" stroke="#94A3B8" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 3 模块深挖 -->
  <rect x="60" y="528" width="1080" height="86" rx="12" fill="#FFFFFF" stroke="#045B89" stroke-width="2"/>
  <rect x="88" y="555" width="44" height="32" rx="16" fill="#045B89"/>
  <text x="110" y="577" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
  <text x="150" y="562" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#0F172A">模块深挖</text>
  <text x="150" y="588" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">每个模块：位置 / 输入 / 内部运作 / 输出 / 不负责什么；一模块一份</text>
  <rect x="960" y="555" width="150" height="32" rx="16" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="1035" y="576" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#92400E">Atlas + Evan</text>
  <line x1="110" y1="614" x2="110" y2="632" stroke="#94A3B8" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 4 写前冻结（闸门） -->
  <rect x="60" y="634" width="1080" height="86" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="3"/>
  <rect x="88" y="661" width="44" height="32" rx="16" fill="#10B981"/>
  <text x="110" y="683" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
  <text x="150" y="668" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#065F46">写前冻结（闸门）</text>
  <text x="150" y="694" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#065F46">术语表（正名 + Avoid）+ 唯一归属表（一段代码只有一个 owner）</text>
  <rect x="960" y="661" width="150" height="32" rx="16" fill="#D1FAE5" stroke="#34D399"/>
  <text x="1035" y="682" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#065F46">Vera Cross</text>
  <line x1="110" y1="720" x2="110" y2="738" stroke="#94A3B8" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 5 写作 -->
  <rect x="60" y="740" width="1080" height="86" rx="12" fill="#FFFFFF" stroke="#045B89" stroke-width="2"/>
  <rect x="88" y="767" width="44" height="32" rx="16" fill="#045B89"/>
  <text x="110" y="789" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">5</text>
  <text x="150" y="774" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#0F172A">写作</text>
  <text x="150" y="800" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">每主题四件套：来龙去脉 → 亮点难点 → 功能流程与架构 → 具体实现；两人范围不重叠</text>
  <rect x="960" y="767" width="150" height="32" rx="16" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="1035" y="788" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#92400E">Lena + Cleo</text>
  <line x1="110" y1="826" x2="110" y2="844" stroke="#94A3B8" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 6 交付闸门 -->
  <rect x="60" y="846" width="1080" height="86" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="3"/>
  <rect x="88" y="873" width="44" height="32" rx="16" fill="#10B981"/>
  <text x="110" y="895" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">6</text>
  <text x="150" y="880" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#065F46">交付闸门</text>
  <text x="150" y="906" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#065F46">拍快照 → 跑 audit_teardown → error 未清零不许汇报；再出查漏清单</text>
  <rect x="960" y="873" width="150" height="32" rx="16" fill="#D1FAE5" stroke="#34D399"/>
  <text x="1035" y="894" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#065F46">主理人 + Vera</text>

  <line x1="600" y1="932" x2="600" y2="960" stroke="#94A3B8" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 产物 -->
  <text x="60" y="984" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#0F172A">产物</text>

  <rect x="60" y="996" width="340" height="104" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="84" y="1024" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#334155">教程目录</text>
  <text x="84" y="1048" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#64748B">&lt;项目名&gt;-拆解教程/</text>
  <text x="84" y="1070" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#64748B">00 综述 · 01 架构 · 02 技术栈</text>
  <text x="84" y="1090" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#64748B">03 实现（四件套）· 04 面试</text>

  <rect x="430" y="996" width="340" height="104" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="454" y="1024" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#334155">.work/ 过程物</text>
  <text x="454" y="1048" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#64748B">01-map 代码地图 · 02-arch 架构</text>
  <text x="454" y="1070" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#64748B">03-deepdive 模块 · freeze 冻结</text>
  <text x="454" y="1090" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#64748B">05-authoring · 06-review</text>

  <rect x="800" y="996" width="340" height="104" rx="10" fill="#ECFDF5" stroke="#10B981"/>
  <text x="824" y="1024" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#065F46">两道闸门</text>
  <text x="824" y="1048" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#065F46">写前冻结：词表 + 归属</text>
  <text x="824" y="1070" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#065F46">交付前：audit_teardown exit 0</text>
  <text x="824" y="1090" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#065F46">断链 · 配图 · 层级 · 术语</text>

  <!-- 图例 -->
  <rect x="60" y="1128" width="16" height="16" rx="8" fill="#045B89"/>
  <text x="86" y="1141" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#64748B">阶段（串行）</text>
  <rect x="210" y="1128" width="16" height="16" rx="8" fill="#10B981"/>
  <text x="236" y="1141" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#64748B">闸门</text>
  <text x="1140" y="1141" text-anchor="end" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#94A3B8">每步的产出是下一步的输入</text>
</svg>
